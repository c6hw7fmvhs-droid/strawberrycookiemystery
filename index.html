<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffe8ef">
<title>STRAWBERRY MYSTERY — 사라진 두쫀쿠</title>
<style>
:root {
  --pink:#e879a0; --deep:#8d3d5c; --pale:#fff0f4; --cream:#fffaf4;
  --line:#f4b9ca; --green:#91a77a; --ink:#63394b;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#fce8ef;color:var(--ink);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
body{min-height:100svh;display:flex;justify-content:center;padding:0}
button{font:inherit;cursor:pointer}
#app{width:100%;max-width:520px;min-height:100svh;background:
  linear-gradient(135deg,rgba(255,255,255,.35) 25%,transparent 25%) 0 0/18px 18px,
  linear-gradient(315deg,rgba(255,255,255,.28) 25%,transparent 25%) 0 0/18px 18px,
  #ffeaf0;position:relative;overflow:hidden}
.screen{min-height:100svh;padding:24px 20px calc(28px + env(safe-area-inset-bottom));}
.hidden{display:none!important}
/* title screen */
.splash{display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;gap:18px;min-height:100svh;padding-top:30px}
.brand{font-size:12px;letter-spacing:3px;color:#a85b76;font-weight:800}
.logo{margin-top:8px;font-weight:950;line-height:1.08;color:#d75d89;text-shadow:2px 2px 0 white,4px 4px 0 #f4b4c8;font-size:clamp(30px,8vw,43px);letter-spacing:-1.8px}
.logo small{display:block;font-size:11px;letter-spacing:4px;margin-top:12px;color:#a75b77;text-shadow:none}
.hero{width:min(76vw,310px);height:min(90vw,390px);max-height:42svh;border:7px solid #fff;border-radius:30px;overflow:hidden;box-shadow:0 8px 0 #f3bfd0,0 14px 28px rgba(160,72,105,.16);position:relative;background:#f5c8d5}
.hero img{width:100%;height:100%;object-fit:cover;object-position:center 28%;image-rendering:pixelated;display:block}
.hero:after{content:"";position:absolute;inset:0;border:1px solid rgba(255,255,255,.65);border-radius:22px;pointer-events:none}
.subtitle{font-size:14px;color:#9d5b73;line-height:1.7}
.start-btn{border:0;border-radius:999px;background:linear-gradient(#f18cad,#df6e96);color:white;font-weight:850;font-size:17px;padding:15px 48px;box-shadow:0 5px 0 #b94f78,0 10px 20px rgba(180,76,117,.18);min-width:220px}
.start-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b94f78}
.splash-foot{font-size:10px;letter-spacing:2px;color:#bd8296;padding-bottom:4px}
/* game UI */
.topbar{display:flex;justify-content:space-between;align-items:center;padding:5px 2px 16px}
.topbrand{font-size:13px;font-weight:900;letter-spacing:1.5px;color:#c85e83}
.day{background:#fff;border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:11px;color:#a75b77;font-weight:800}
.welcome{background:rgba(255,255,255,.88);border:2px solid white;border-radius:23px;padding:18px;margin-bottom:14px;box-shadow:0 4px 0 #f3c4d2}
.welcome h1{font-size:22px;margin:0 0 5px;color:#c9557d}
.welcome p{font-size:13px;line-height:1.6;margin:0;color:#85546a}
.feature{display:flex;gap:13px;align-items:center;margin-top:14px;background:#fff5f7;border-radius:16px;padding:10px}
.feature img{width:76px;height:76px;object-fit:cover;object-position:center 25%;border-radius:13px;border:3px solid white;image-rendering:pixelated}
.feature b{display:block;font-size:13px;margin-bottom:4px}
.feature span{font-size:11px;color:#996b7e;line-height:1.5}
.section-title{font-size:14px;font-weight:900;color:#98506b;margin:20px 3px 10px}
.menu-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.menu-item{min-height:105px;border:2px solid #fff;background:rgba(255,255,255,.88);border-radius:19px;color:#a34f70;box-shadow:0 4px 0 #f1c0cf;padding:12px 5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px}
.menu-item:active{transform:translateY(2px);box-shadow:0 2px 0 #f1c0cf}
.menu-icon{font-size:27px;line-height:1}
.menu-label{font-size:12px;font-weight:800}
.bottom-nav{position:sticky;bottom:0;margin:22px -20px -28px;padding:12px 15px calc(12px + env(safe-area-inset-bottom));background:rgba(255,250,252,.96);border-top:2px solid #f6cada;display:flex;justify-content:space-around}
.nav-btn{border:0;background:transparent;color:#a86b82;font-size:10px;font-weight:800;display:flex;flex-direction:column;gap:4px;align-items:center}
.nav-btn span{font-size:20px}
.content-head{display:flex;align-items:center;gap:10px;margin:5px 0 18px}
.back{border:0;border-radius:50%;width:38px;height:38px;background:#fff;color:#c65b82;font-size:20px}
.content-head h2{font-size:20px;color:#c9557d;margin:0}
.panel{background:rgba(255,255,255,.9);border:2px solid white;border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 4px 0 #f2c2d1}
.panel h3{margin:0 0 8px;color:#a84f70;font-size:15px}
.panel p{font-size:13px;line-height:1.7;margin:0;color:#795164}
.list-btn{width:100%;text-align:left;border:1px solid #f4c7d4;border-radius:14px;background:#fff8fa;color:#85516a;padding:13px;margin-top:8px;font-size:13px;font-weight:700}
.note{font-size:11px;color:#ad7b8e;margin-top:12px;line-height:1.6}
@media(min-width:600px){#app{margin:18px auto;min-height:calc(100svh - 36px);border-radius:30px;box-shadow:0 15px 50px rgba(139,64,91,.15)}.screen{min-height:calc(100svh - 36px)}.splash{min-height:calc(100svh - 36px)}}
</style>
</head>
